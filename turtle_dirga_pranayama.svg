<svg id="dirgaSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
        <style><![CDATA[
          /* 10-Second Dirga Pranayama Breathing Cycle */
          /* Inhale 1 (0-15%): Inguinal flank expands */
          /* Inhale 2 (15-30%): Visceral drop under rigid shell */
          /* Inhale 3 (30-45%): Pectoral rotation & throat hyoid drops */
          /* Hold (45-55%): Kumbhaka / Stillness */
          /* Exhale (55-90%): Reverse release wave (throat -> shoulder -> belly -> flank) */
          /* Rest (90-100%): Neutral pause */

          /* PART 1: Rear Inguinal / Flank Pocket (Posterior Abdomen) */
          .wave-p1 {
            animation: animP1 10s ease-in-out infinite;
            transform-origin: 245px 335px;
          }
          @keyframes animP1 {
            0%       { transform: scale(1, 1); }
            15%, 55% { transform: scale(1.14, 1.22) translate(-4px, 4px); }
            85%, 100%{ transform: scale(1, 1); }
          }

          /* PART 2: Ventral Visceral Floor / Belly Drop (Middle Torso) */
          /* Note: Carapace (Shell) is 100% rigid. Only soft underbelly drops downward! */
          .wave-p2 {
            animation: animP2 10s ease-in-out infinite;
            transform-origin: 380px 320px;
          }
          @keyframes animP2 {
            0%, 15%  { transform: scale(1, 1); }
            30%, 55% { transform: scale(1.05, 1.18) translateY(5px); }
            80%, 100%{ transform: scale(1, 1); }
          }

          /* PART 3A: Pectoral Girdle / Shoulder Rotation (Upper Chest) */
          .wave-p3-shoulder {
            animation: animShoulder 10s ease-in-out infinite;
            transform-origin: 470px 320px;
          }
          @keyframes animShoulder {
            0%, 30%  { transform: rotate(0deg); }
            45%, 55% { transform: rotate(-7deg) translateY(-4px); }
            75%, 100%{ transform: rotate(0deg); }
          }

          /* PART 3B: Hyoid / Throat Gular Drop (Buccal Air Pump) */
          .wave-p3-throat {
            animation: animThroat 10s ease-in-out infinite;
            transform-origin: 550px 290px;
          }
          @keyframes animThroat {
            0%, 30%  { transform: scaleY(1); }
            45%, 55% { transform: scaleY(1.22) translateY(3px); }
            70%, 100%{ transform: scaleY(1); }
          }

          /* Head subtle angle */
          .head-tilt {
            animation: animHead 10s ease-in-out infinite;
            transform-origin: 470px 310px;
          }
          @keyframes animHead {
            0%, 30%  { transform: rotate(0deg); }
            45%, 55% { transform: rotate(-3.5deg) translate(6px, -5px); }
            75%, 100%{ transform: rotate(0deg); }
          }

          /* Glowing Wave Indicators */
          .glow-indicator-1 { animation: glowP1 10s ease-in-out infinite; }
          .glow-indicator-2 { animation: glowP2 10s ease-in-out infinite; }
          .glow-indicator-3 { animation: glowP3 10s ease-in-out infinite; }

          @keyframes glowP1 {
            0%       { opacity: 0.15; transform: scale(0.9); }
            15%, 55% { opacity: 0.85; transform: scale(1.15); }
            85%, 100%{ opacity: 0.15; transform: scale(0.9); }
          }
          @keyframes glowP2 {
            0%, 15%  { opacity: 0.15; transform: scale(0.9); }
            30%, 55% { opacity: 0.85; transform: scale(1.15); }
            80%, 100%{ opacity: 0.15; transform: scale(0.9); }
          }
          @keyframes glowP3 {
            0%, 30%  { opacity: 0.15; transform: scale(0.9); }
            45%, 55% { opacity: 0.85; transform: scale(1.15); }
            75%, 100%{ opacity: 0.15; transform: scale(0.9); }
          }

          /* Exhale Bubbles Stream */
          .bubble-ex { animation: bExStream 10s ease-out infinite; }
          @keyframes bExStream {
            0%, 58%  { opacity: 0; transform: translate(674px, 250px) scale(0.2); }
            64%      { opacity: 0.85; transform: translate(694px, 230px) scale(0.7); }
            82%      { opacity: 0.7; transform: translate(728px, 150px) scale(1.05); }
            95%      { opacity: 0; transform: translate(752px, 85px) scale(1.3); }
            100%     { opacity: 0; }
          }

          /* Eye relaxed meditation */
          .turtle-eye-meditate {
            animation: eyeMed 10s ease-in-out infinite;
            transform-origin: 605px 235px;
          }
          @keyframes eyeMed {
            0%, 40%   { transform: scaleY(1); }
            45%, 65%  { transform: scaleY(0.65); }
            75%, 90%  { transform: scaleY(1); }
            92%       { transform: scaleY(0.1); }
            94%, 100% { transform: scaleY(1); }
          }

          /* Gentle Ocean Float */
          .ocean-float {
            animation: oBob 10s ease-in-out infinite;
            transform-origin: 400px 320px;
          }
          @keyframes oBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
          }
        ]]></style>

        <!-- Deep Ocean Backdrop -->
        <rect width="800" height="600" fill="#082032" rx="24"/>
        <ellipse cx="400" cy="560" rx="380" ry="140" fill="#041422" opacity="0.8"/>
        <ellipse cx="400" cy="70" rx="360" ry="100" fill="#0f3657" opacity="0.45"/>
        <ellipse cx="400" cy="300" rx="320" ry="240" fill="#0b2840" opacity="0.4"/>

        <!-- Rigid Shell Indicator Banner -->
        <g transform="translate(375, 145)" opacity="0.85">
          <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
          <text text-anchor="middle" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">
            🔒 RIGID CARAPACE (NO EXPANSION)
          </text>
        </g>

        <!-- Main Turtle Floating Group -->
        <g class="ocean-float">
          
          <!-- Background Flippers -->
          <path d="M 270 290 C 230 250 170 260 130 290 C 120 298 130 315 150 315 C 190 315 240 310 270 290 Z" fill="#047857"/>
          <path class="wave-p3-shoulder" d="M 470 250 C 510 180 570 120 630 110 C 645 108 650 120 640 135 C 595 190 535 255 480 270 Z" fill="#047857"/>
          <path d="M 230 320 C 190 325 150 338 135 348 C 150 355 190 350 235 338 Z" fill="#10b981"/>

          <!-- PART 1: Inguinal Flank Pocket (Hind-pocket expansion) -->
          <g class="wave-p1" id="group-p1">
            <path d="M 245 335 C 215 370 160 415 125 425 C 112 428 110 415 122 400 C 155 360 215 328 245 335 Z" fill="#10b981" stroke="#059669" stroke-width="2"/>
            <ellipse cx="205" cy="355" rx="28" ry="18" fill="#34d399" opacity="0.35"/>
          </g>

          <!-- PART 2: Belly (Plastron) Visceral Floor Drop -->
          <g class="wave-p2" id="group-p2">
            <path d="M 250 320 C 270 380 360 415 450 395 C 480 388 495 365 500 330 C 460 345 360 355 250 320 Z" fill="#fde047"/>
            <path d="M 280 350 C 340 395 420 405 460 385 C 440 375 360 365 300 340 Z" fill="#eab308"/>
            <path d="M 340 345 C 350 372 370 392 390 398" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M 415 340 C 430 365 445 380 460 382" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M 280 340 C 335 375 405 380 450 365" stroke="#fef9c3" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
          </g>

          <!-- THE RIGID CARAPACE (Fused Ribs & Spine) - 100% UNMOVING -->
          <g id="rigid-shell">
            <path d="M 215 320 C 210 200 320 145 440 160 C 510 170 545 225 530 320 C 475 345 275 345 215 320 Z" fill="#065f46" stroke="#047857" stroke-width="2"/>
            <path d="M 210 320 C 230 345 300 358 385 354 C 460 350 515 342 535 320 C 525 338 460 365 385 362 C 295 360 225 340 210 320 Z" fill="#f59e0b"/>
            
            <!-- Scute Plates -->
            <path d="M 255 240 L 310 220 L 330 260 L 290 280 L 250 265 Z" fill="#10b981"/>
            <path d="M 320 215 L 390 195 L 430 220 L 400 260 L 340 255 Z" fill="#34d399"/>
            <path d="M 400 195 L 455 210 L 485 245 L 440 265 L 410 225 Z" fill="#10b981"/>
            <path d="M 345 265 L 405 268 L 435 310 L 375 315 L 330 295 Z" fill="#059669"/>
            <path d="M 445 270 L 485 250 L 515 285 L 495 320 L 440 315 Z" fill="#10b981"/>
            <path d="M 285 285 L 325 295 L 340 325 L 280 325 L 250 305 Z" fill="#047857"/>

            <!-- Dorsal Lung outline silhouette (Internal anatomy cutaway preview) -->
            <path d="M 260 220 C 320 185 410 190 460 210 C 475 235 440 255 350 255 C 280 255 255 240 260 220 Z" fill="#38bdf8" opacity="0.18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
            <text x="355" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#bae6fd" opacity="0.8">
              [Dorsal Lungs Attached to Shell]
            </text>
          </g>

          <!-- PART 3: Head, Neck, Throat & Foreflipper -->
          <g class="head-tilt" id="group-p3">
            <!-- Neck Base -->
            <path d="M 470 315 C 500 320 540 310 575 280 C 585 265 575 240 550 230 C 515 220 480 240 460 265 Z" fill="#10b981"/>

            <!-- Throat / Hyoid Apparatus (Gular Breath Drop) -->
            <g class="wave-p3-throat">
              <path d="M 535 290 C 555 308 580 305 595 282" stroke="#047857" stroke-width="3" stroke-linecap="round" fill="#34d399" opacity="0.75"/>
              <ellipse cx="565" cy="296" rx="16" ry="8" fill="#34d399" opacity="0.4"/>
            </g>

            <!-- Head Profile -->
            <path d="M 545 240 C 555 195 615 190 655 215 C 690 238 695 275 670 295 C 640 315 585 310 555 280 C 542 268 540 252 545 240 Z" fill="#10b981"/>
            <circle cx="674" cy="250" r="2.5" fill="#064e3b"/>
            <path d="M 676 264 C 668 274 650 280 630 276" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
            <ellipse cx="628" cy="270" rx="9" ry="6" fill="#fb7185" opacity="0.6"/>

            <!-- Eye -->
            <g id="turtle-eye" class="turtle-eye-meditate">
              <ellipse cx="605" cy="235" rx="15" ry="17" fill="#ffffff" stroke="#065f46" stroke-width="2"/>
              <ellipse cx="608" cy="235" rx="11" ry="13" fill="#1e293b"/>
              <circle cx="612" cy="230" r="4.5" fill="#ffffff"/>
              <circle cx="604" cy="242" r="2.2" fill="#ffffff"/>
            </g>
          </g>

          <!-- Foreflipper / Pectoral Girdle swing -->
          <g class="wave-p3-shoulder">
            <path d="M 470 315 C 510 335 565 390 580 460 C 585 485 568 495 545 490 C 495 478 450 410 430 360 C 420 338 440 315 470 315 Z" fill="#10b981" stroke="#059669" stroke-width="2"/>
            <circle cx="475" cy="355" r="5" fill="#6ee7b7"/>
            <circle cx="500" cy="395" r="5.5" fill="#6ee7b7"/>
            <circle cx="525" cy="440" r="4.5" fill="#6ee7b7"/>
          </g>

          <!-- Dynamic Wave Glow Rings with Anatomical Callouts -->
          <!-- Zone 1 Callout (Flank) -->
          <g transform="translate(190, 360)" class="glow-indicator-1" id="callout-p1">
            <circle cx="0" cy="0" r="26" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
            <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fde68a">1. Flank</text>
          </g>

          <!-- Zone 2 Callout (Viscera) -->
          <g transform="translate(365, 415)" class="glow-indicator-2" id="callout-p2">
            <circle cx="0" cy="0" r="28" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3"/>
            <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#a7f3d0">2. Viscera</text>
          </g>

          <!-- Zone 3 Callout (Shoulder/Gular) -->
          <g transform="translate(565, 335)" class="glow-indicator-3" id="callout-p3">
            <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3"/>
            <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#bae6fd">3. Gular</text>
          </g>

        </g> <!-- End Ocean Float -->

        <!-- Exhale Bubbles Stream -->
        <g class="bubble-ex" transform="translate(900, 900)">
          <circle cx="0" cy="0" r="12" fill="#7dd3fc" opacity="0.6"/>
          <circle cx="-3" cy="-3" r="3.5" fill="#ffffff" opacity="0.9"/>
          <circle cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
        </g>

        <!-- Dynamic Timeline Bar at Bottom -->
        <g transform="translate(400, 555)">
          <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#051726" stroke="#1e3a5f" stroke-width="1.5"/>
          <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
            <tspan fill="#f59e0b">1. FLANK (1.5s)</tspan>
            <tspan fill="#475569"> → </tspan>
            <tspan fill="#10b981">2. VISCERA (1.5s)</tspan>
            <tspan fill="#475569"> → </tspan>
            <tspan fill="#38bdf8">3. GULAR (1.5s)</tspan>
            <tspan fill="#475569"> | </tspan>
            <tspan fill="#cbd5e1">EXHALE (4.5s)</tspan>
          </text>
        </g>
      </svg>