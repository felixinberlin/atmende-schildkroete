<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <style><![CDATA[
    /* 10s Anatomical Cycle */
    .visceral-piston {
      animation: pistonPump 10s ease-in-out infinite;
      transform-origin: 400px 320px;
    }
    @keyframes pistonPump {
      0%       { transform: translateY(0px) scaleY(1); }
      45%, 55% { transform: translateY(16px) scaleY(1.15); }
      85%, 100%{ transform: translateY(0px) scaleY(1); }
    }

    .lung-inflation {
      animation: lungFill 10s ease-in-out infinite;
      transform-origin: 400px 220px;
    }
    @keyframes lungFill {
      0%       { transform: scale(1, 1); opacity: 0.65; }
      45%, 55% { transform: scale(1.05, 1.22) translateY(3px); opacity: 0.95; }
      85%, 100%{ transform: scale(1, 1); opacity: 0.65; }
    }

    .pectoral-rock {
      animation: scapulaRock 10s ease-in-out infinite;
      transform-origin: 510px 300px;
    }
    @keyframes scapulaRock {
      0%, 25%  { transform: rotate(0deg); }
      45%, 55% { transform: rotate(-9deg) translateY(-4px); }
      80%, 100%{ transform: rotate(0deg); }
    }

    .gular-pump {
      animation: gularDrop 10s ease-in-out infinite;
      transform-origin: 610px 280px;
    }
    @keyframes gularDrop {
      0%, 25%  { transform: scaleY(1); }
      45%, 55% { transform: scaleY(1.3) translateY(3px); }
      75%, 100%{ transform: scaleY(1); }
    }

    .air-flow {
      animation: airDash 2s linear infinite;
    }
    @keyframes airDash {
      0%   { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
  ]]></style>

  <!-- Deep Ocean Slate Background -->
  <rect width="850" height="560" fill="#061826" rx="20"/>

  <!-- Static Turtle Silhouette Backdrop -->
  <!-- Carapace (100% Rigid) -->
  <path d="M 230 300 C 220 170 340 110 470 125 C 540 135 585 190 570 300 C 510 330 290 330 230 300 Z" fill="#042f2e" stroke="#0d9488" stroke-width="2.5" opacity="0.45"/>
  <path d="M 230 300 C 250 330 320 345 410 340 C 490 335 550 325 570 300" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Plastron (Underbelly boundary) -->
  <path d="M 265 305 C 285 380 385 420 480 398 C 515 390 535 360 545 320" stroke="#ca8a04" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Head & Neck Ghost Profile -->
  <path d="M 500 295 C 530 300 570 290 605 260 C 620 240 680 230 705 255 C 725 275 720 300 695 318 C 660 335 605 325 575 295" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  <circle cx="704" cy="256" r="3" fill="#38bdf8"/>
  <circle cx="665" cy="256" r="6" fill="#1e293b"/>

  <!-- Airway Stream: Nares -> Glottis -> Trachea -> Lungs -->
  <path class="air-flow" d="M 704 256 C 680 264 635 270 575 275 C 525 280 485 260 440 230" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- ==================== INTERNAL CUTAWAY ==================== -->
  
  <!-- 1. DORSAL LUNGS (Anchored to rigid shell ceiling) -->
  <g class="lung-inflation">
    <path d="M 250 270 C 260 175 360 145 460 155 C 505 160 540 195 535 270 C 480 285 320 285 250 270 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <!-- Honeycomb Lung Vascular Mesh -->
    <path d="M 300 195 Q 340 180 390 190 T 480 185" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity="0.8"/>
    <path d="M 280 230 Q 360 220 440 230 T 510 225" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity="0.8"/>
    <circle cx="360" cy="210" r="14" fill="#0369a1" opacity="0.5"/>
    <circle cx="430" cy="215" r="16" fill="#0369a1" opacity="0.5"/>
  </g>

  <!-- 2. DIAPHRAGMATICUS MEMBRANE (Fibrous Boundary Sheet) -->
  <path class="visceral-piston" d="M 245 278 Q 390 298 535 278" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" fill="none"/>

  <!-- 3. VISCERAL MASS (Liver, Stomach, Guts = The Hydraulic Piston) -->
  <g class="visceral-piston">
    <path d="M 255 288 C 275 365 370 405 465 385 C 500 375 525 345 530 288 C 480 303 320 303 255 288 Z" fill="#b45309" stroke="#f59e0b" stroke-width="2" opacity="0.85"/>
    <ellipse cx="350" cy="335" rx="35" ry="20" fill="#92400e" opacity="0.75"/>
    <ellipse cx="430" cy="340" rx="42" ry="22" fill="#78350f" opacity="0.75"/>
    <!-- Inguinal expansion bulge -->
    <ellipse cx="280" cy="350" rx="22" ry="14" fill="#d97706" opacity="0.6"/>
  </g>

  <!-- 4. PECTORAL GIRDLE (Scapula & Coracoid inside ribcage) -->
  <g class="pectoral-rock">
    <path d="M 495 280 L 525 350 L 485 365 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="495" cy="280" r="4.5" fill="#38bdf8"/>
  </g>

  <!-- 5. GULAR / HYOID THROAT PUMP -->
  <g class="gular-pump">
    <path d="M 570 290 C 590 315 635 315 655 290" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="#059669" opacity="0.6"/>
  </g>

  <!-- ==================== ANATOMICAL CALLOUT LABELS ==================== -->

  <!-- Top Title -->
  <g transform="translate(425, 55)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#5eead4" letter-spacing="1.5">
      TURTLE VISCERAL PUMP (INTERNAL CUTAWAY)
    </text>
  </g>

  <!-- Global Connector Lines -->
  <line x1="205" y1="218" x2="260" y2="218" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="260" cy="218" r="3" fill="#38bdf8"/>

  <line x1="195" y1="290" x2="250" y2="280" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="250" cy="280" r="3" fill="#f43f5e"/>

  <line x1="340" y1="445" x2="360" y2="385" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="360" cy="385" r="3" fill="#f59e0b"/>

  <line x1="630" y1="390" x2="515" y2="340" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="515" cy="340" r="3" fill="#94a3b8"/>

  <line x1="650" y1="210" x2="615" y2="285" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="615" cy="285" r="3" fill="#10b981"/>

  <!-- Callout 1: Dorsal Lungs (Left) -->
  <g transform="translate(45, 192)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#082842" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. DORSAL LUNGS</text>
    <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#bae6fd">Glued to shell ceiling</text>
  </g>

  <!-- Callout 2: Diaphragmaticus (Left bottom) -->
  <g transform="translate(35, 268)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#2d0612" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fb7185">2. MEMBRANE</text>
    <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#fecdd3">Fibrous divider sheet</text>
  </g>

  <!-- Callout 3: Visceral Piston (Bottom Center) -->
  <g transform="translate(240, 445)">
    <rect x="0" y="0" width="185" height="50" rx="8" fill="#2d1b06" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">3. VISCERAL PISTON</text>
    <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#fef3c7">Organs drop ↓ to pull air</text>
  </g>

  <!-- Callout 4: Pectoral Girdle (Right middle) -->
  <g transform="translate(630, 365)">
    <rect x="0" y="0" width="175" height="50" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">4. PECTORAL GIRDLE</text>
    <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Shoulder blade inside ribs</text>
  </g>

  <!-- Callout 5: Gular Hyoid Pump (Right top) -->
  <g transform="translate(650, 185)">
    <rect x="0" y="0" width="165" height="50" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">5. GULAR PUMP</text>
    <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Hyoid drops throat floor</text>
  </g>

  <!-- Bottom Dynamic Instruction Banner -->
  <g transform="translate(425, 525)">
    <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">
      Notice: The dorsal shell never moves. Breathing is entirely driven by visceral &amp; girdle mechanics.
    </text>
  </g>
</svg>
